[project]
name = "my-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
my-fastapi = "my_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
    "uvicorn>=0.54.0",
]

[tool.taskipy.tasks]
runserver = "uvicorn main:app --reload"
runserver-prod = "uvicorn main:app --host 0.0.0.0 --port 8000"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
